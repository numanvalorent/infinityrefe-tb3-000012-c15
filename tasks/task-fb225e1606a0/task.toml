schema_version = "1.3"
artifacts = ["/app/output.json", "/app/run.sh", "/app/propagate.py"]

[task]
name = "tbench/damped-oscillator"
description = "Build a stable propagator for free, critically damped and stiff damped mechanical oscillators."

[metadata]
category = "Science"
subcategory = "Physics"
tags = ["numerical-analysis", "ordinary-differential-equations", "stability"]
task_objective = ["implement", "validate"]
artifact_type = ["single_script_or_program", "dataset_or_tabular_file"]
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
expert_time_estimate_hours = 1
difficulty_explanation = "Near-critical damping, zero damping, tiny timesteps and stiff overdamping require stable formulas rather than a single naive exponential or Euler update. Model difficulty is unmeasured."
solution_explanation = "The Oracle uses the exact real-valued damped-oscillator transition with a cancellation-safe overdamped branch and a continuous critical-damping limit."
verification_explanation = "An independent 100-digit Decimal matrix exponential computes expectations; the deliverable is replayed on fresh seeded mechanical systems with the same documented domain and tolerances."

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"

[infinity]
profile = "tb3"

[infinity.witness]
program = ["/bin/bash", "/app/run.sh"]
inputs = ["/app/data/input.json"]
outputs = ["/app/output.json"]
witnesses = 3
program_timeout_sec = 20
pytest = ["/tests/test_outputs.py"]

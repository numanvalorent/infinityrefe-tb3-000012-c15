# Opt-in experts-free-v1 infrastructure; original canonical template stays unchanged.
# Dedicated, disposable local QA runner. No model or platform secrets.
# The server separately verifies this exact workflow and permitted changed paths.
name: fellow-precheck
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: fellow-precheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  calibration:
    name: Static checks and Harbor Oracle/Nop
    runs-on: ${{ fromJSON(vars.FELLOW_RUNNER_LABELS || '["self-hosted","tbench-fellow-qa"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
      - name: Check immutable revision and task structure
        id: task
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          roots = list(Path('tasks').glob('*/task.toml'))
          if len(roots) != 1:
              raise SystemExit('Exactly one task directory is required')
          root = roots[0].parent
          if any(p.is_symlink() for p in Path('.').rglob('*')):
              raise SystemExit('Symlinks are not permitted')
          for name in ('instruction.md', 'environment/Dockerfile', 'solution/solve.sh', 'tests/Dockerfile', 'tests/test.sh', 'tests/test_outputs.py'):
              if not (root / name).is_file():
                  raise SystemExit(f'Missing {name}')
          data = tomllib.loads((root / 'task.toml').read_text())
          if data.get('schema_version') not in {'1.3', '2.0'} or not isinstance(data.get('artifacts'), list) or not data['artifacts']:
              raise SystemExit('A supported schema (1.3 or 2.0) and a top-level nonempty artifacts list are required')
          if data.get('verifier', {}).get('environment_mode') != 'separate':
              raise SystemExit('A separate verifier is required')
          for section in ('agent', 'verifier'):
              timeout = data.get(section, {}).get('timeout_sec', 0)
              if not isinstance(timeout, (int, float)) or isinstance(timeout, bool) or not 0 < timeout <= 3600:
                  raise SystemExit('Tbench trial profile requires positive timeouts at most 3600 seconds')
          if data.get('environment', {}).get('gpus', 0) != 0:
              raise SystemExit('This runner does not support GPU tasks')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'path={root.as_posix()}\n')
          PY
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv tool install 'harbor==0.18.0'
      - name: Run Oracle and Nop
        env:
          TASK_PATH: ${{ steps.task.outputs.path }}
        run: |
          harbor run -p "$TASK_PATH" --agent oracle --env docker --job-name oracle --jobs-dir jobs --n-concurrent 1 --yes
          harbor run -p "$TASK_PATH" --agent nop --env docker --job-name nop --jobs-dir jobs --n-concurrent 1 --yes
      - name: Verify complete calibration evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name, reward in [('oracle', 1.0), ('nop', 0.0)]:
              result = json.loads((Path('jobs') / name / 'result.json').read_text())
              stats = result.get('stats') or {}
              if result.get('n_total_trials') != 1 or stats.get('n_completed_trials') != 1 or stats.get('n_errored_trials') or stats.get('n_cancelled_trials'):
                  raise SystemExit(f'{name}: incomplete or errored trial')
              evaluations = list((stats.get('evals') or {}).values())
              if len(evaluations) != 1 or evaluations[0].get('n_trials') != 1:
                  raise SystemExit(f'{name}: invalid evaluation count')
              metrics = evaluations[0].get('metrics') or []
              if len(metrics) != 1 or metrics[0].get('mean') != reward:
                  raise SystemExit(f'{name}: incorrect reward')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: calibration-${{ github.event.pull_request.head.sha }}
          path: jobs/
          if-no-files-found: ignore
